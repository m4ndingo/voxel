<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOCK · Árboles</title>
<style>
  :root{ color-scheme:dark; }
  body{ margin:0; font:14px/1.4 system-ui,sans-serif; background:#0f1420; color:#e7ecf3; padding:20px; }
  h1{ font-size:18px; margin:0 0 4px; }
  p.sub{ margin:0 0 18px; color:#8b97a8; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .card{ background:#141b28; border:1px solid #26314a; border-radius:12px; padding:12px; text-align:center; }
  canvas{ width:200px; height:220px; image-rendering:pixelated; }
  .name{ font-weight:600; margin-top:6px; }
  .role{ font-size:12px; color:#8b97a8; }
  .rot{ margin-top:8px; }
  .rot button{ background:#20293c; color:#cfd8e6; border:1px solid #33405e; border-radius:7px; padding:3px 9px; cursor:pointer; }
  @media(max-width:680px){ .grid{ grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); } canvas{ width:150px; height:165px; } }
</style></head>
<body>
<h1>🌳 Árboles voxel <span style="color:#f0a54a">· MOCK</span></h1>
<p class="sub">Catálogo de prueba (<code>assets/trees_mock/</code>). Tronco + ramas + copa. Aún no son assets.</p>
<div class="grid" id="grid"></div>
<script>
function shade(hex,f){ const n=parseInt(hex.slice(1),16); const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  return 'rgb('+c(n>>16&255)+','+c(n>>8&255)+','+c(n&255)+')'; }
// Renderiza un modelo voxel disperso en iso, con culling de caras ocultas y rotación (0..3).
function render(cv, voxels, rot){
  const ctx=cv.getContext('2d'), dpr=2, W=cv.clientWidth||200, H=cv.clientHeight||220;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const occ=new Set(Object.keys(voxels));
  // parse + rota en XY (rot·90°) alrededor de un centro fijo (16)
  const rotXY=(x,y)=>{ x-=16;y-=16; for(let i=0;i<rot;i++){ const t=x; x=-y; y=t; } return [x+16,y+16]; };
  const list=[]; let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,minz=1e9,maxz=-1e9;
  for(const k in voxels){ const p=k.split(',').map(Number); const [rx,ry]=rotXY(p[0],p[1]);
    list.push({rx,ry,z:p[2],c:voxels[k],k});
    minx=Math.min(minx,rx);maxx=Math.max(maxx,rx);miny=Math.min(miny,ry);maxy=Math.max(maxy,ry);minz=Math.min(minz,p[2]);maxz=Math.max(maxz,p[2]); }
  // escala para llenar el lienzo
  const wu=(maxx-minx)+(maxy-miny)+2, hu=(maxx-minx)+(maxy-miny)+(maxz-minz)*2+2;
  const S=Math.max(2, Math.min(W*0.92/wu, H*0.92/hu*2)*1.0), h=S*0.5, V=S;
  const proj=(vx,vy,vz)=>[(vx-vy)*S, (vx+vy)*h - vz*V];
  // bbox de pantalla para centrar
  let pminX=1e9,pmaxX=-1e9,pminY=1e9,pmaxY=-1e9;
  for(const v of list){ const P=proj(v.rx,v.ry,v.z);
    pminX=Math.min(pminX,P[0]-S);pmaxX=Math.max(pmaxX,P[0]+S);pminY=Math.min(pminY,P[1]-h);pmaxY=Math.max(pmaxY,P[1]+h+V); }
  const ox=(W-(pmaxX-pminX))/2-pminX, oy=(H-(pmaxY-pminY))/2-pminY;
  list.sort((a,b)=>(a.rx+a.ry)-(b.rx+b.ry) || a.z-b.z);   // pintor: de atrás/abajo a delante/arriba
  const has=(rx,ry,z)=>{ // ¿hay voxel (en coords rotadas) ahí? deshacemos la rotación para consultar occ
    let x=rx-16,y=ry-16; for(let i=0;i<((4-rot)%4);i++){ const t=x; x=-y; y=t; } return occ.has((x+16)+','+(y+16)+','+z); };
  const quad=(a,b,c,d,fill)=>{ ctx.beginPath(); ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); };
  for(const v of list){ const sx=proj(v.rx,v.ry,v.z)[0]+ox, sy=proj(v.rx,v.ry,v.z)[1]+oy;
    if(!has(v.rx,v.ry,v.z+1)) quad([sx,sy-h],[sx+S,sy],[sx,sy+h],[sx-S,sy], shade(v.c,1.10));         // top +Z
    if(!has(v.rx,v.ry+1,v.z)) quad([sx-S,sy],[sx,sy+h],[sx,sy+h+V],[sx-S,sy+V], shade(v.c,0.72));      // +Y izq
    if(!has(v.rx+1,v.ry,v.z)) quad([sx+S,sy],[sx,sy+h],[sx,sy+h+V],[sx+S,sy+V], shade(v.c,0.55));      // +X dcha
  }
}
fetch('index.json').then(r=>r.json()).then(list=>{
  const g=document.getElementById('grid');
  list.forEach(t=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML='<canvas></canvas><div class="name">'+(t.icon||'')+' '+t.name+'</div>'+
      '<div class="role">'+(t.role||'')+'</div><div class="rot"><button>↻ girar</button></div>';
    g.appendChild(card);
    const cv=card.querySelector('canvas'); let rot=0, vox=null;
    fetch('/'+t.file).then(r=>r.json()).then(d=>{ vox=d.voxels; render(cv,vox,rot); });
    card.querySelector('button').onclick=()=>{ if(vox){ rot=(rot+1)&3; render(cv,vox,rot); } };
  });
});
</script></body></html>
